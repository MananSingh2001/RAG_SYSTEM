name: CI

# Free-tier friendly:
#  - `syntax` runs on every push/PR. It only does `node --check`, so it needs
#    no dependencies, no API keys, and consumes zero model quota.
#  - `eval` is manual (workflow_dispatch). It calls the embedding + LLM APIs and
#    reads from Supabase, so it is opt-in to avoid burning free-tier quota on
#    every commit. Add the four secrets below in the repo settings to use it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax check (no API, free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check all source files
        run: npm run check

  eval:
    name: Full eval (manual — uses API quota)
    runs-on: ubuntu-latest
    # only runs when triggered by hand, never automatically on a commit
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: Run evaluation scorecard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # a small delay avoids free-tier rate limits (429)
          DOCMIND_EVAL_DELAY_MS: '1200'
        run: npm run eval
